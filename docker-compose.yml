# ── Docker Compose for Local Development ────────────────────────
# Provides: FastAPI app, PostgreSQL, MongoDB (Cosmos DB emulator)

version: "3.9"

services:
  # ── FastAPI Application ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical-ai-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - SERVICE_MODE=mock
      - DATABASE_URL=postgresql+asyncpg://clinical_user:clinical_secret@postgres:5432/clinical_triage
      - COSMOS_DB_CONNECTION_STRING=mongodb://mongodb:27017
      - COSMOS_DB_NAME=clinical_reports
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clinical-ai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: clinical_user
      POSTGRES_PASSWORD: clinical_secret
      POSTGRES_DB: clinical_triage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U clinical_user -d clinical_triage" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MongoDB (Cosmos DB emulator) ────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: clinical-ai-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
